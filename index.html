<!DOCTYPE html>
<html>
<head>
    <title>Turnout Playground</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23252526'/%3E%3Cpath d='M25 25 L70 50 L25 75' stroke='%23007acc' stroke-width='9' fill='none' stroke-linejoin='round' stroke-linecap='round'/%3E%3Ccircle cx='70' cy='50' r='7' fill='%2300ff00'/%3E%3C/svg%3E">
    <style>
        body { display: flex; height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        .editor, .preview { flex: 1; display: flex; flex-direction: column; height: 100%; }
        
        textarea { 
            flex: 1; 
            padding: 20px; 
            font-family: 'Fira Code', 'Courier New', monospace; 
            font-size: 14px; 
            border: none; 
            background: #1e1e1e; 
            color: #d4d4d4; 
            resize: none; 
            outline: none; 
            tab-size: 4; 
            caret-color: #00ff00; 
            spellcheck: false; 
        }
        
        iframe { flex: 1; border: none; background: white; width: 100%; height: 100%; }
        
        /* Toolbar Styling */
        .toolbar { 
            padding: 8px 15px; 
            background: #252526; 
            color: #eee; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid #333;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .toolbar-label { display: flex; align-items: center; gap: 8px; }

        /* Button Styling */
        button {
            padding: 5px 12px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            margin-left: 4px;
        }

        /* RUN/REFRESH Button */
        button[onclick="updatePreview()"] { background-color: #007acc; color: white; }
        button[onclick="updatePreview()"]:hover { background-color: #005a9e; box-shadow: 0 0 8px rgba(0, 122, 204, 0.3); }

        /* SHARE Button */
        button[onclick="shareCode()"] { background-color: #28a745; color: white; }
        button[onclick="shareCode()"]:hover { background-color: #218838; }

        /* CLEAR Button */
        button[onclick="resetDefault()"] { background-color: #444; color: #ccc; }
        button[onclick="resetDefault()"]:hover { background-color: #555; color: white; }

        button:active { transform: translateY(1px); }
    </style>
</head>
<body>

    <div id="editor-container" class="editor">
        <div class="toolbar">
            <div class="toolbar-label">
                <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                    <rect width="100" height="100" rx="20" fill="#333"/>
                    <path d="M25 25 L70 50 L25 75" stroke="#007acc" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
                    <circle cx="70" cy="50" r="7" fill="#00ff00"/>
                </svg>
                <span>HTML Editor</span>
            </div>
            <div>
                <button onclick="shareCode()">Share</button>
                <button onclick="resetDefault()">Clear</button>
            </div>
        </div>
        <textarea id="code" placeholder="Type your HTML here..."></textarea>
    </div>

    <div id="preview-container" class="preview">
        <div class="toolbar">
            <div class="toolbar-label">
                <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                    <rect width="100" height="100" rx="20" fill="#333"/>
                    <path d="M25 25 L70 50 L25 75" stroke="#007acc" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
                    <circle cx="70" cy="50" r="7" fill="#00ff00"/>
                </svg>
                <span>Live Preview</span>
                <strong id="preview-title"></strong>
            </div>
            <button onclick="updatePreview()">Refresh</button>
        </div>
        <iframe id="display"></iframe>
    </div>

    <script src="turnout-playground.js"></script>
</body>
</html>
