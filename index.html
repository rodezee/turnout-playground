<!DOCTYPE html>
<html>
<head>
    <title>Turnout Playground</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23252526'/%3E%3Cpath d='M25 25 L70 50 L25 75' stroke='%23007acc' stroke-width='9' fill='none' stroke-linejoin='round' stroke-linecap='round'/%3E%3Ccircle cx='70' cy='50' r='7' fill='%2300ff00'/%3E%3C/svg%3E">
    <style>
        body { display: flex; height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .editor, .preview { flex: 1; display: flex; flex-direction: column; }
        
        textarea { 
            flex: 1; 
            padding: 20px; 
            font-family: 'Fira Code', 'Courier New', monospace; 
            font-size: 14px; 
            border: none; 
            background: #1e1e1e; 
            color: #d4d4d4; 
            resize: none; 
            outline: none; 
            tab-size: 4; 
            caret-color: #00ff00; 
            spellcheck: false; 
        }
        
        iframe { flex: 1; border: none; background: white; }
        
        /* Toolbar Styling */
        .toolbar { 
            padding: 8px 15px; 
            background: #252526; 
            color: #eee; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid #333;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Button Styling */
        button {
            padding: 5px 15px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        /* RUN Button (Primary) */
        button[onclick="updatePreview()"] {
            background-color: #007acc;
            color: white;
        }

        button[onclick="updatePreview()"]:hover {
            background-color: #005a9e;
            box-shadow: 0 0 8px rgba(0, 122, 204, 0.4);
        }

        /* CLEAR Button (Secondary/Neutral) */
        button[onclick="resetDefault()"] {
            background-color: #444;
            color: #ccc;
        }

        button[onclick="resetDefault()"]:hover {
            background-color: #555;
            color: white;
        }

        button:active {
            transform: translateY(1px);
        }
    </style>
    <script src="/turnout-playground.js" defer></script>
</head>
<body>

    <div id="editor-container" class="editor">
        <div class="toolbar">
            <svg width="20" height="20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
              <rect width="100" height="100" rx="20" fill="#252526"/>
              <path d="M25 25 L70 50 L25 75" stroke="#007acc" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
              <circle cx="70" cy="50" r="7" fill="#00ff00"/>
            </svg>
            <span>HTML Editor</span>
            <button onclick="resetDefault()">Clear</button>
        </div>
        <textarea id="code" placeholder="Type your HTML here..."></textarea>
    </div>

    <div id="preview-container" class="preview">
        <div class="toolbar">
            <svg width="20" height="20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
              <rect width="100" height="100" rx="20" fill="#252526"/>
              <path d="M25 25 L70 50 L25 75" stroke="#007acc" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
              <circle cx="70" cy="50" r="7" fill="#00ff00"/>
            </svg>
            <span>Live Preview</span>
            <button onclick="updatePreview()">Refresh</button>
        </div>
        <iframe id="display"></iframe>
    </div>

</body>
</html>
