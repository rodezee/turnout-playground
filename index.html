<!DOCTYPE html>
<html>
<head>
    <title>Turnout Playground</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23252526'/%3E%3Cpath d='M25 25 L70 50 L25 75' stroke='%23007acc' stroke-width='9' fill='none' stroke-linejoin='round' stroke-linecap='round'/%3E%3Ccircle cx='70' cy='50' r='7' fill='%2300ff00'/%3E%3C/svg%3E">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    
    <style>
        body { display: flex; height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        .editor, .preview { flex: 1; display: flex; flex-direction: column; height: 100%; }
        
        .editor-wrapper {
            position: relative;
            flex: 1;
            background: #1e1e1e;
            overflow: auto; /* The wrapper handles all scrolling */
        }

        #code, #highlight-layer {
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            line-height: 21px;
            white-space: pre;      /* Prevents random wrapping */
            word-wrap: normal;
            border: none;
            position: absolute;    /* Stacks them exactly on top of each other */
            top: 0;
            left: 0;
            min-width: 100%;
            min-height: 100%;
        }

        #code {
            z-index: 2;
            background: transparent !important;
            color: transparent !important;
            caret-color: #00ff00;
            resize: none;
            outline: none;
            overflow: hidden;      /* Hide textarea's own scrollbars */
        }

        #highlight-layer {
            z-index: 1;
            pointer-events: none;  /* Lets you click "through" to the textarea */
            background: #1e1e1e;
            overflow: hidden;
        }

        /* This is the actual code inside the pre tag */
        #highlight-content {
            font-family: inherit;
        }

        iframe { flex: 1; border: none; background: white; width: 100%; height: 100%; }
        
        .toolbar { 
            padding: 8px 15px; 
            background: #252526; 
            color: #eee; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid #333;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .toolbar-label { display: flex; align-items: center; gap: 8px; }
        .toolbar-label a { line-height: 0; }
        #preview-title { color: #00ff00; font-weight: bold; margin-left: 5px; text-transform: none; }

        button {
            padding: 5px 12px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            margin-left: 4px;
        }

        button[onclick="updatePreview()"] { background-color: #007acc; color: white; }
        button[onclick="updatePreview()"]:hover { background-color: #005a9e; box-shadow: 0 0 8px rgba(0, 122, 204, 0.3); }

        button[onclick="saveCode()"] { background-color: #007acc; color: white; }
        button[onclick="saveCode()"]:hover { background-color: #005a9e; box-shadow: 0 0 8px rgba(0, 122, 204, 0.3); }

        button[onclick="shareCode()"] { background-color: #28a745; color: white; }
        button[onclick="shareCode()"]:hover { background-color: #218838; }

        button[onclick="resetDefault()"] { background-color: #444; color: #ccc; }
        button[onclick="resetDefault()"]:hover { background-color: #555; color: white; }

        button:active { transform: translateY(1px); }
    </style>
</head>
<body>

    <div id="editor-container" class="editor">
        <div class="toolbar">
            <div class="toolbar-label">
                <a href="https://github.com/rodezee/turnout-playground">
                    <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                        <rect width="100" height="100" rx="20" fill="#333"/>
                        <path d="M25 25 L70 50 L25 75" stroke="#007acc" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
                        <circle cx="70" cy="50" r="7" fill="#00ff00"/>
                    </svg>
                </a>
                <span>HTML Editor</span>
            </div>
            <div>
                <span id="messages"></span>
                <button onclick="saveCode()" title="CTRL + S">Save</button>
                <button onclick="shareCode()">Share</button>
                <button onclick="resetDefault()">Clear</button>
            </div>
        </div>
        
        <div class="editor-wrapper">
            <pre id="highlight-layer" aria-hidden="true"><code class="language-html" id="highlight-content"></code></pre>
            <textarea id="code" spellcheck="false"></textarea>
        </div>
    </div>

    <div id="preview-container" class="preview">
        <div class="toolbar">
            <div class="toolbar-label">
                <a href="https://github.com/rodezee/turnout-playground">
                    <svg aria-hidden="true" focusable="false" class="octicon octicon-mark-github" viewBox="0 0 24 24" width="18" height="18" fill="white" display="inline-block" overflow="visible" style="vertical-align:text-bottom">
                        <path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"></path>
                    </svg>
                </a>
                <span>Preview:</span>
                <span id="preview-title"></span>
            </div>
            <button onclick="updatePreview()">Refresh</button>
        </div>
        <iframe id="display"></iframe>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    
    <script src="turnout-playground.js"></script>
</body>
</html>
